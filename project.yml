name: Recharge
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "30"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  Recharge:
    build:
      targets:
        Recharge: all
        RechargeWatch: all
        RechargeTests: [test]
    test:
      targets:
        - RechargeTests
      config: Debug
    run:
      config: Debug
      storeKitConfiguration: Recharge.storekit
  RechargeWatch:
    build:
      targets:
        RechargeWatch: all
    run:
      config: Debug
  # Kept out of the Recharge scheme: it needs a booted simulator and taps the
  # HealthKit permission sheet, so it is far slower than the logic suite.
  RechargeUITests:
    build:
      targets:
        Recharge: all
        RechargeUITests: [test]
    test:
      config: Debug
      targets:
        - RechargeUITests
    run:
      config: Debug
      storeKitConfiguration: Recharge.storekit

targets:
  Recharge:
    type: application
    platform: iOS
    sources:
      - path: Recharge
      - path: Shared
      - path: Recharge.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.recovery
        INFOPLIST_FILE: Recharge/Info.plist
        CODE_SIGN_ENTITLEMENTS: Recharge/Recharge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: RechargeWidget
      - target: RechargeWatch
        embed: true

  RechargeWatch:
    type: application
    platform: watchOS
    sources:
      - path: RechargeWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.recovery.watch
        INFOPLIST_FILE: RechargeWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: RechargeWatch/RechargeWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: RechargeWatchWidget

  RechargeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RechargeWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.recovery.widget
        INFOPLIST_FILE: RechargeWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: RechargeWidget/RechargeWidget.entitlements
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  RechargeWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: RechargeWatchWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.recovery.watch.widget
        INFOPLIST_FILE: RechargeWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: RechargeWatchWidget/RechargeWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  # Pure-logic suite. Only the calculator and its value types are compiled in,
  # so the model can be exercised without HealthKit, SwiftData, or RevenueCat.
  RechargeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RechargeTests
      - path: Shared/Models/RecoveryModels.swift
      - path: Shared/Models/RecoverySnapshot.swift
      # The SwiftData schema, so the persistence round-trip is testable. It was
      # out of the target and the gap showed: `carriedHours` was computed,
      # published, and rendered without ever being written to a record, and
      # nothing in a 252-test suite could see it.
      - path: Shared/Models/RecoveryRecords.swift
      - path: Shared/Utilities/SessionLoadCalculator.swift
      - path: Shared/Utilities/RecoveryBaseline.swift
      - path: Shared/Utilities/RecoveryCalculator.swift
      - path: Shared/Utilities/RecoveryResolver.swift
      - path: Shared/Utilities/AthleteProfile.swift
      - path: Shared/Utilities/PersonalRecoveryModel.swift
      - path: Shared/Utilities/WorkoutClassifier.swift
      - path: Shared/Utilities/CountdownFormat.swift
      - path: Shared/Utilities/CountdownTimeline.swift
      - path: Shared/Utilities/ComplicationCopy.swift
      - path: Shared/Utilities/RechargeConversionCopy.swift
      # The receipt the app prints back to the user for every Health type it
      # asks for. In the target because it owns user-facing copy about what the
      # model consumes, and copy that describes the model is part of the model's
      # surface area.
      - path: Shared/Utilities/HealthIngestSummary.swift
      - path: Shared/Utilities/DateHelpers.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.recovery.tests

  RechargeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RechargeUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.recovery.uitests
        TEST_TARGET_NAME: Recharge
    dependencies:
      - target: Recharge
